version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: accord_crm_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accord_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: accord_crm_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
